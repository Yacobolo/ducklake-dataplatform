# https://taskfile.dev

version: '3'

vars:
  DB_PATH: ./ducklake_meta.sqlite
  MIGRATIONS_DIR: internal/db/migrations

tasks:
  migrate-up:
    desc: Run database migrations up
    cmds:
      - goose -dir {{.MIGRATIONS_DIR}} sqlite3 {{.DB_PATH}} up

  migrate-down:
    desc: Run database migrations down
    cmds:
      - goose -dir {{.MIGRATIONS_DIR}} sqlite3 {{.DB_PATH}} down

  migrate-status:
    desc: Show database migration status
    cmds:
      - goose -dir {{.MIGRATIONS_DIR}} sqlite3 {{.DB_PATH}} status

  new-migration:
    desc: "Create a new migration (usage: task new-migration -- NAME)"
    cmds:
      - goose -dir {{.MIGRATIONS_DIR}} create {{.CLI_ARGS}} sql

  sqlc:
    desc: Generate sqlc code
    cmds:
      - sqlc generate

  genduckdb:
    desc: Regenerate DuckDB catalog metadata (keywords, types, functions)
    dir: scripts/genduckdb
    cmds:
      - go run . -gen=all -outdir=../../internal/duckdbsql/catalog/

  generate:api:
    desc: Generate server/CLI from JSON IR (apigen)
    deps: [typespec:compile]
    cmds:
      - find pkg/cli/gen -maxdepth 1 -type f -name '*.gen.go' ! -name 'apigen_registry.gen.go' -delete
      - go run ./cmd/apigen all -ir api/gen/json-ir.json
      - go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.4.1 -generate types,skip-prune -package api -o internal/api/types.gen.go api/gen/openapi.yaml
    sources:
      - api/gen/json-ir.json
      - cmd/apigen/**/*.go
      - internal/apigen/**/*.go
    generates:
      - api/gen/openapi.yaml
      - api/gen/json-ir.json
      - internal/api/gen_request_models.gen.go
      - internal/api/server.apigen.gen.go
      - pkg/cli/gen/apigen_registry.gen.go

  typespec:compile:
    desc: Compile TypeSpec into OpenAPI and JSON IR artifacts
    cmds:
      - npm install --prefix tools/typespec-ir-emitter
      - npm install --prefix api/spec
      - npm run compile --prefix api/spec
    sources:
      - api/spec/**/*.tsp
      - api/spec/tspconfig.yaml
      - api/spec/package.json
      - tools/typespec-ir-emitter/**/*
    generates:
      - api/gen/openapi.yaml
      - api/gen/json-ir.json

  verify:apigen-generated:
    desc: Verify apigen artifacts are up to date
    preconditions:
      - sh: test -f api/gen/openapi.yaml
        msg: "apigen artifacts missing. Run 'task generate:api' first."
    cmds:
      - task generate:api
      - test -f internal/api/gen_request_models.gen.go
      - test -f internal/api/server.apigen.gen.go
      - test -f pkg/cli/gen/apigen_registry.gen.go
      - git diff --exit-code -- api/gen/openapi.yaml internal/api/gen_request_models.gen.go internal/api/server.apigen.gen.go pkg/cli/gen/apigen_registry.gen.go

  generate:declarative-schema:
    desc: Generate declarative JSON Schema artifacts
    cmds:
      - go run ./cmd/declarative-schema-gen -outdir schemas/declarative/v1
    sources:
      - internal/declarative/*.go
      - cmd/declarative-schema-gen/*.go
    generates:
      - schemas/declarative/v1/duck.declarative.schema.json
      - schemas/declarative/v1/index.json
      - schemas/declarative/v1/kinds/*.schema.json

  verify:declarative-schema:
    desc: Verify declarative schema artifacts are up to date
    cmds:
      - task generate:declarative-schema
      - git diff --exit-code -- schemas/declarative/v1

  docs:generate:
    desc: Generate docs reference pages from generated API and schemas
    deps: [generate:api, generate:declarative-schema]
    cmds:
      - go run ./cmd/docsgen -openapi api/gen/openapi.yaml -declarative-index schemas/declarative/v1/index.json -declarative-dir schemas/declarative/v1 -outdir docs/reference/generated
    sources:
      - api/gen/openapi.yaml
      - schemas/declarative/v1/index.json
      - schemas/declarative/v1/kinds/*.schema.json
      - cmd/docsgen/*.go
      - internal/docsgen/**/*.go
    generates:
      - docs/reference/generated/api/index.md
      - docs/reference/generated/api/features.md
      - docs/reference/generated/declarative/index.md

  docs:generate:generated:
    desc: Generate docs from canonical OpenAPI artifact and declarative schemas
    deps: [generate:api, generate:declarative-schema]
    cmds:
      - go run ./cmd/docsgen -openapi api/gen/openapi.yaml -declarative-index schemas/declarative/v1/index.json -declarative-dir schemas/declarative/v1 -outdir docs/reference/generated

  docs:dev:
    desc: Start VitePress docs dev server
    deps: [docs:generate]
    cmds:
      - npm install --prefix docs
      - npm run docs:dev --prefix docs

  docs:build:
    desc: Build static docs site with VitePress
    deps: [docs:generate]
    cmds:
      - npm ci --prefix docs
      - npm run docs:build --prefix docs

  ui:assets:
    desc: Install web deps and build UI CSS assets
    cmds:
      - npm ci --prefix web
      - npm run build --prefix web

  verify:docs-generated:
    desc: Verify docs reference pages can be generated from canonical artifacts
    cmds:
      - task docs:generate
      - test -f docs/reference/generated/api/index.md
      - test -f docs/reference/generated/api/features.md
      - test -f docs/reference/generated/declarative/index.md

  generate:
    desc: Run all code generation
    deps: [generate:api, sqlc, genduckdb, generate:declarative-schema]

  build:
    desc: Build all packages
    preconditions:
      - sh: test -f internal/api/server.apigen.gen.go
        msg: "Generated files missing. Run 'task generate' first."
    cmds:
      - go build ./...

  build-cli:
    desc: Build the CLI binary
    cmds:
      - go build -ldflags "-X main.version={{.GIT_TAG}}" -o bin/duck ./cmd/cli

  build-agent:
    desc: Build the compute agent binary
    cmds:
      - go build -o bin/compute-agent ./cmd/compute-agent

  test:
    desc: Run all tests (unit + integration)
    deps: [test:unit, test:integration]

  test:unit:
    desc: Run unit tests (package summary, shows failures inline)
    cmds:
      - gotestsum --format pkgname-and-test-fails -- -race ./...

  test:arch:
    desc: Run architecture governance tests
    cmds:
      - gotestsum --format pkgname-and-test-fails -- ./internal/architecture/...

  test:integration:
    desc: Run integration tests (package summary, shows failures inline)
    cmds:
      - gotestsum --format pkgname-and-test-fails -- -tags integration -timeout 120s ./test/integration/... ./internal/api ./internal/service/security ./internal/service/ingestion ./internal/service/storage ./internal/engine

  examples:test:
    desc: Run declarative examples integration suite
    cmds:
      - gotestsum --format pkgname-and-test-fails -- -tags integration -run TestDeclarativeExamples_ ./test/integration/...

  examples:validate:
    desc: Validate all example declarative config directories
    cmds:
      - for dir in examples/*/config; do go run ./cmd/cli validate --config-dir "$dir"; done

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run all linters (Go + OpenAPI)
    deps: [lint:go, lint:api]

  lint:go:
    desc: Run Go linters
    deps: [generate:api]
    cmds:
      - golangci-lint run

  lint:api:
    desc: Lint canonical OpenAPI spec for consistency
    deps: [generate:api]
    cmds:
      - go run ./cmd/lint-api api/gen/openapi.yaml

  lint:api:generated:
    desc: Alias for canonical OpenAPI lint
    deps: [generate:api]
    cmds:
      - go run ./cmd/lint-api api/gen/openapi.yaml

  lint:api:typespec:
    desc: Lint TypeSpec OpenAPI artifact for consistency
    deps: [typespec:compile]
    cmds:
      - go run ./cmd/lint-api api/gen/openapi.yaml

  test-cli:
    desc: Run CLI tests
    cmds:
      - gotestsum --format pkgname-and-test-fails -- -race ./pkg/cli/...

  integration-test:
    desc: "Run integration tests (alias for test:integration)"
    deps: [test:integration]

  check:
    desc: Run all checks (lint + test) and print a CI-style summary
    silent: true
    cmds:
      - |
        failed=0
        results=""
        for step in lint:go lint:api verify:apigen-generated verify:declarative-schema verify:docs-generated test:arch test:unit test:integration; do
          if task "$step" > /dev/null 2>&1; then
            results="${results}  ${step} ... ok\n"
          else
            results="${results}  ${step} ... FAIL\n"
            failed=1
          fi
        done
        printf "\n=== Check Summary ===\n${results}\n"
        if [ "$failed" -eq 1 ]; then
          echo "Some checks failed. Run the individual task for details."
          exit 1
        else
          echo "All checks passed."
        fi
