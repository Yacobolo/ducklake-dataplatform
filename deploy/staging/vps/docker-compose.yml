services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: "${PUBLIC_DOMAIN}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  control-plane:
    image: ghcr.io/yacobolo/ducklake-dataplatform-control-plane:${IMAGE_TAG:-main-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "32010:32010"
      - "5433:5433"
    environment:
      LISTEN_ADDR: ":8080"
      META_DB_PATH: "/data/ducklake_meta.sqlite"
      LOG_LEVEL: "info"
      ENV: "production"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS}"
      JWT_SECRET: "${JWT_SECRET}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"

      FEATURE_REMOTE_ROUTING: "true"
      FEATURE_ASYNC_QUEUE: "true"
      FEATURE_CURSOR_MODE: "true"
      FEATURE_INTERNAL_GRPC: "true"
      FEATURE_FLIGHT_SQL: "true"
      FEATURE_PG_WIRE: "true"
      FLIGHT_SQL_LISTEN_ADDR: ":32010"
      PG_WIRE_LISTEN_ADDR: ":5433"

      KEY_ID: "${S3_ACCESS_KEY}"
      SECRET: "${S3_SECRET_KEY}"
      ENDPOINT: "${S3_ENDPOINT}"
      REGION: "${S3_REGION}"
      BUCKET: "${S3_BUCKET}"
    volumes:
      - control_plane_data:/data

  compute-agent:
    image: ghcr.io/yacobolo/ducklake-dataplatform-compute-agent:${IMAGE_TAG:-main-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9443:9443"
      - "9444:9444"
    environment:
      AGENT_TOKEN: "${AGENT_TOKEN}"
      LISTEN_ADDR: ":9443"
      GRPC_LISTEN_ADDR: ":9444"
      MAX_MEMORY_GB: "${AGENT_MAX_MEMORY_GB:-2}"
      QUERY_RESULT_TTL: "${AGENT_QUERY_RESULT_TTL:-10m}"
      QUERY_CLEANUP_INTERVAL: "${AGENT_QUERY_CLEANUP_INTERVAL:-1m}"
      FEATURE_CURSOR_MODE: "true"
      FEATURE_INTERNAL_GRPC: "true"

      CATALOG_DSN: "host=postgres port=5432 dbname=${POSTGRES_DB} user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} sslmode=disable"

      S3_KEY_ID: "${S3_ACCESS_KEY}"
      S3_SECRET: "${S3_SECRET_KEY}"
      S3_ENDPOINT: "${S3_ENDPOINT}"
      S3_REGION: "${S3_REGION}"
      S3_BUCKET: "${S3_BUCKET}"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  caddy_data:
  caddy_config:
  control_plane_data:
  postgres_data:
