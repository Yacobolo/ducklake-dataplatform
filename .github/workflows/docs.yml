name: Docs

on:
  push:
    branches: [main]
    paths:
      - site/**
      - api/spec/**
      - api/gen/openapi.yaml
      - tools/typespec-ir-emitter/**
      - internal/apigen/**
      - cmd/apigen/**
      - cmd/sitegen/**
      - internal/api/**
      - internal/declarative/**
      - internal/docsgen/**
      - cmd/docsgen/**
      - internal/sitegen/**
      - schemas/declarative/**
      - Taskfile.yml
  pull_request:
    branches: [main]
    paths:
      - site/**
      - api/spec/**
      - api/gen/openapi.yaml
      - tools/typespec-ir-emitter/**
      - internal/apigen/**
      - cmd/apigen/**
      - cmd/sitegen/**
      - internal/api/**
      - internal/declarative/**
      - internal/docsgen/**
      - cmd/docsgen/**
      - internal/sitegen/**
      - schemas/declarative/**
      - Taskfile.yml

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.8"
  NODE_VERSION: "20"
  TASK_VERSION: "v3.45.4"

permissions:
  contents: read

jobs:
  build:
    name: Build Docs Site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}

      - name: Build docs
        run: task site:build
        env:
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
