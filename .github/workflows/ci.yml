name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.8"
  VULNCHECK_GO_VERSION: "1.26.1"
  NODE_VERSION: "20"
  # Pinned tool versions for reproducible builds
  TASK_VERSION: "v3.45.4"
  GOTESTSUM_VERSION: "v1.13.0"
  SQLC_VERSION: "v1.30.0"
  GOVULNCHECK_VERSION: "v1.1.4"
  GOLANGCI_LINT_VERSION: "v2.7"

permissions:
  contents: read
  actions: read

jobs:
  # ── Generate ────────────────────────────────────────────────
  # Shared job: produces generated code artifact once so downstream
  # jobs skip TypeSpec/APIGen setup and sqlc entirely, including the
  # APIGen-generated compatibility types file used by fresh checkouts.
  generate:
    name: Generate Code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          go-version: ${{ env.GO_VERSION }}
          download-generated: 'false'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@${{ env.SQLC_VERSION }}
      - name: Run code generation
        run: task generate
      - name: Upload generated code
        uses: actions/upload-artifact@v4
        with:
          name: generated-code
          path: |
            api/gen/openapi.yaml
            internal/api/gen_request_models.gen.go
            internal/api/server.apigen.gen.go
            internal/api/types.gen.go
            internal/db/dbstore/
            pkg/cli/gen/
            schemas/declarative/
            internal/duckdbsql/catalog/
          retention-days: 1

  image-build-check:
    name: Image Build Check (${{ matrix.name }})
    needs: generate
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: control-plane
            dockerfile: Dockerfile
            image_suffix: control-plane
          - name: compute-agent
            dockerfile: Dockerfile.compute-agent
            image_suffix: compute-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: generated-code
          path: .
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: local/${{ matrix.image_suffix }}:pr-check
          cache-from: type=gha,scope=${{ matrix.image_suffix }}
          cache-to: type=gha,scope=${{ matrix.image_suffix }},mode=max

  # ── Lint ────────────────────────────────────────────────────
  lint:
    name: Lint
    needs: generate
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v7
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}
      - name: Lint OpenAPI spec
        run: task lint:api
      - name: Verify apigen artifacts
        run: task verify:apigen-generated
      - name: Verify declarative schema artifacts
        run: task verify:declarative-schema

  # ── Tests ───────────────────────────────────────────────────
  arch:
    name: Architecture Governance
    needs: generate
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}
          go install gotest.tools/gotestsum@${{ env.GOTESTSUM_VERSION }}
      - name: Run architecture governance tests
        run: task test:arch

  security-governance:
    name: Security Governance
    needs: generate
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}
      - name: Validate declarative security governance
        run: go test ./internal/declarative -run "Preset|Binding|Grant"

  test:
    name: Tests (${{ matrix.suite }})
    needs: generate
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        suite: [unit, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}
          go install gotest.tools/gotestsum@${{ env.GOTESTSUM_VERSION }}
      - name: Run ${{ matrix.suite }} tests
        run: task test:${{ matrix.suite }}

  live-e2e-generated-strict:
    name: Live E2E Generated Strict
    needs: generate
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}
      - name: Run strict generated live suite
        run: task test:e2e:live:generated:strict

  # ── Build & Vet ─────────────────────────────────────────────
  build:
    name: Build & Vet
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}
      - name: Vet
        run: task vet
      - name: Build
        run: task build

  # ── Vulnerability Check ────────────────────────────────────
  vulncheck:
    name: Vulnerability Check
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          go-version: ${{ env.VULNCHECK_GO_VERSION }}
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
      - name: Run govulncheck
        run: govulncheck ./...
