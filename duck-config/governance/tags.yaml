apiVersion: duck/v1
kind: TagConfig
tags:
  - key: classification
    value: pii
  - key: classification
    value: sensitive
  - key: classification
    value: confidential
  - key: classification
    value: public
  - key: classification
    value: personal_data
  - key: sensitivity
    value: high
  - key: sensitivity
    value: medium
  - key: sensitivity
    value: low
  - key: dataset
    value: demo
  - key: contains_public_data
assignments:
  - tag: dataset:demo
    securable_type: schema
    securable: seeded_local.nyc_taxi
  - tag: contains_public_data
    securable_type: schema
    securable: seeded_local.nyc_taxi
