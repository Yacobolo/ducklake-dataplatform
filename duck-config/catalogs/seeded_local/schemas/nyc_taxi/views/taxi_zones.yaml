apiVersion: duck/v1
kind: View
metadata:
  name: taxi_zones
spec:
  comment: TLC taxi zone lookup cached from the public CSV
  owner: __DUCK_DEV_BOOTSTRAP_PRINCIPAL__
  view_definition: |
    SELECT
      CAST(LocationID AS INTEGER) AS location_id,
      Borough AS borough,
      Zone AS zone,
      service_zone
    FROM read_csv_auto('__DUCK_DEV_TAXI_ZONES__', header = true)
