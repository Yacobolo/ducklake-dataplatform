apiVersion: duck/v1
kind: GrantList
grants:
  - principal: analytics-users
    principal_type: group
    securable_type: catalog
    securable: seeded_local
    privilege: USAGE
  - principal: analytics-users
    principal_type: group
    securable_type: schema
    securable: seeded_local.nyc_taxi
    privilege: USAGE
  - principal: data-platform
    principal_type: group
    securable_type: catalog
    securable: seeded_local
    privilege: ALL_PRIVILEGES
  - principal: data-platform
    principal_type: group
    securable_type: schema
    securable: seeded_local.nyc_taxi
    privilege: ALL_PRIVILEGES
