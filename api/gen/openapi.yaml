components:
  schemas:
    APIKeyInfo:
      type: object
      required:
        - id
        - principal_id
        - name
      properties:
        id:
          type: string
        principal_id:
          type: string
        name:
          type: string
        key_prefix:
          type: string
        expires_at:
          type: string
        created_at:
          type: string
    AuditEntry:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        principal_name:
          type: string
        action:
          type: string
        statement_type:
          type: string
        original_sql:
          type: string
        rewritten_sql:
          type: string
        tables_accessed:
          type: array
          items:
            type: string
        status:
          type: string
        error_message:
          type: string
        duration_ms:
          type: integer
          format: int64
        created_at:
          type: string
    CatalogInfo:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        comment:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
    CatalogRegistration:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        metastore_type:
          type: string
        dsn:
          type: string
        data_path:
          type: string
        status:
          type: string
        is_default:
          type: boolean
        comment:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
    CatalogRegistrationList:
      type: object
      required:
        - catalogs
      properties:
        catalogs:
          type: array
          items:
            $ref: '#/components/schemas/CatalogRegistration'
        next_page_token:
          type: string
        total_count:
          type: integer
          format: int32
    CleanupAPIKeysResponse:
      type: object
      required:
        - deleted_count
      properties:
        deleted_count:
          type: integer
          format: int32
    ColumnMask:
      type: object
      required:
        - id
        - table_id
        - column_name
        - mask_expression
      properties:
        id:
          type: string
        table_id:
          type: string
        column_name:
          type: string
        mask_expression:
          type: string
        description:
          type: string
        created_at:
          type: string
    ColumnMaskBindingRequest:
      type: object
      required:
        - principal_id
        - principal_type
      properties:
        principal_id:
          type: string
        principal_type:
          type: string
        see_original:
          type: boolean
    CreateAPIKeyRequest:
      type: object
      required:
        - principal_id
      properties:
        principal_id:
          type: string
        name:
          type: string
        expires_at:
          type: string
    CreateAPIKeyResponse:
      type: object
      required:
        - id
        - key
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
        key_prefix:
          type: string
        expires_at:
          type: string
        created_at:
          type: string
    CreateCatalogRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        metastore_type:
          type: string
        dsn:
          type: string
        data_path:
          type: string
        comment:
          type: string
    CreateColumnMaskRequest:
      type: object
      required:
        - column_name
        - mask_expression
      properties:
        column_name:
          type: string
        mask_expression:
          type: string
        description:
          type: string
    CreateGrantRequest:
      type: object
      required:
        - principal_id
        - principal_type
        - securable_type
        - securable_id
        - privilege
      properties:
        principal_id:
          type: string
        principal_type:
          type: string
        securable_type:
          type: string
        securable_id:
          type: string
        privilege:
          type: string
    CreateGroupMemberRequest:
      type: object
      required:
        - member_type
        - member_id
      properties:
        member_type:
          type: string
        member_id:
          type: string
    CreateGroupRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
    CreatePrincipalRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        type:
          type: string
        is_admin:
          type: boolean
    CreateRowFilterRequest:
      type: object
      required:
        - filter_sql
      properties:
        table_id:
          type: string
        filter_sql:
          type: string
        description:
          type: string
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    Group:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
    GroupMember:
      type: object
      required:
        - group_id
        - member_type
        - member_id
      properties:
        group_id:
          type: string
        member_type:
          type: string
        member_id:
          type: string
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
    ManifestColumn:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        type:
          type: string
    ManifestRequest:
      type: object
      required:
        - table
      properties:
        table:
          type: string
        schema:
          type: string
    ManifestResponse:
      type: object
      required:
        - table
      properties:
        table:
          type: string
        schema:
          type: string
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ManifestColumn'
        files:
          type: array
          items:
            type: string
        row_filters:
          type: array
          items:
            type: string
        column_masks:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
    MetastoreSummary:
      type: object
      required:
        - catalog_name
      properties:
        catalog_name:
          type: string
        metastore_type:
          type: string
        storage_backend:
          type: string
        data_path:
          type: string
        schema_count:
          type: integer
          format: int32
        table_count:
          type: integer
          format: int32
    PaginatedAPIKeys:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/APIKeyInfo'
